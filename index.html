<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7eee8">
<title>Bhargavi & Venu Gopal — Engagement</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="intro" class="intro">
  <div class="intro-card">
    <div class="rings">♡</div>
    <p class="small">YOU ARE CORDIALLY INVITED</p>
    <h1>Bhargavi<br><span>&amp;</span><br>Venu Gopal</h1>
    <p class="date">17 · AUGUST · 2026</p>
    <button id="openBtn" class="primary" type="button">Open Invitation</button>
    <p class="hint">Tap to begin</p>
  </div>
</div>
<header class="controls" aria-label="Invitation controls">
  <button id="musicBtn" type="button">♫ Music</button>
  <button id="autoBtn" type="button">↕ Auto Scroll</button>
</header>
<main id="invitation">
  <section class="page page-1" aria-label="Open invitation"></section>
  <section class="page page-2" aria-label="Welcome to our engagement"></section>
  <section class="page page-3" aria-label="Bride and groom details"></section>
  <section class="page page-4" aria-label="Event details"></section>
  <section class="page page-5 countdown-page" aria-label="Live countdown">
    <div id="countdown" class="countdown-card">
      <div class="countdown-title">COUNTDOWN TO OUR SPECIAL DAY</div>
      <div class="countdown-date">17 AUGUST 2026 · 11:46 AM</div>
      <div class="countdown-grid">
        <div><strong data-days>00</strong><span>DAYS</span></div>
        <div><strong data-hours>00</strong><span>HOURS</span></div>
        <div><strong data-minutes>00</strong><span>MINUTES</span></div>
        <div><strong data-seconds>00</strong><span>SECONDS</span></div>
      </div>
    </div>
  </section>
  <section class="page page-6 location-page" aria-label="Location">
    <a class="map-hotspot" href="https://maps.app.goo.gl/XndBFP5rhNetA5S5A?g_st=aw" target="_blank" rel="noopener" aria-label="Open Nandu's Grand Family Restaurant in Google Maps"></a>
  </section>
  <section class="page page-7" aria-label="Bless us with your presence"></section>
</main>
<script src="script.js"></script>
</body>
</html>
