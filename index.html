<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7eee8">
<title>Bhargavi & Venu Gopal — Engagement</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="intro" class="intro">
  <div class="intro-card">
    <div class="rings">♡</div>
    <p class="small">YOU ARE CORDIALLY INVITED</p>
    <h1>Bhargavi<br><span>&amp;</span><br>Venu Gopal</h1>

    <button id="openBtn" class="primary">Open Invitation</button>
    <p class="hint">Tap to begin</p>

</div>

<header class="controls" aria-label="Invitation controls">
  <button id="musicBtn" title="Toggle music">♫ Music</button>
  <button id="autoBtn" title="Toggle automatic scrolling">↕ Auto Scroll</button>

  <section class="page page-2" aria-label="Welcome to our engagement"></section>
  <section class="page page-3" aria-label="Bride and groom details"></section>
  <section class="page page-4" aria-label="Event details"></section>
  <section class="page page-5" aria-label="Location">

    <a class="map-hotspot" href="https://maps.app.goo.gl/XndBFP5rhNetA5S5A?g_st=aw" target="_blank" rel="noopener" aria-label="Open location in Google Maps"></a>
  </section>

  <section class="page page-6" aria-label="Bless us with your presence"></section>

<script src="script.js"></script>
</body>
</html>
